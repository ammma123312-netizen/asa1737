name: ASA Swarm (763B, zero cost)

# A Petals-style swarm built from free GitHub-hosted runners:
#   * DeepSeek-V4.1-Flash (763B, MIT) at its native precision, token-exact
#     (Colibri cluster mode: workers run routed experts, the coordinator keeps
#     attention, routing and the engram table).
#   * Weights are never downloaded in full: every node mounts the public
#     Hugging Face repo through HFFS (asa/swarm/hffs.py) and reads only the
#     bytes it needs. No account, key or payment anywhere.
#   * Workers expose their port through bore (free public TCP relay) and find
#     the coordinator through this run's own artifacts (asa/swarm/rendezvous.py).
#
# This is an experiment/benchmark of the ASA inference stack, started by hand.
# GitHub's terms allow Actions for building and testing the project; do not turn
# it into an always-on public service.
#
# Free plan: up to 20 concurrent jobs per account, 6 h per job.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt"
        default: "ما هي عاصمة المملكة العربية السعودية؟"
      ngen:
        description: "Tokens to generate"
        default: "64"
      workers:
        description: "Expert workers (coordinator + workers must stay <= 19 on the free plan)"
        default: "16"
      relay:
        description: "bore relay host (bore.pub is the free public one)"
        default: "bore.pub"

permissions:
  contents: read
  actions: read

env:
  REPO: deepseek-ai/DeepSeek-V4.1-Flash
  BORE_VERSION: v0.6.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          n="${{ inputs.workers }}"
          [ "$n" -ge 1 ] && [ "$n" -le 18 ] || { echo "workers must be 1..18"; exit 1; }
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range(1,$n+1))))")" >> "$GITHUB_OUTPUT"

  worker:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        i: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the expert cache
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
      - name: Node setup (HFFS mount + Colibri)
        run: CACHE_GB=50 ./asa/swarm/node_setup.sh
      - name: Start expert worker + relay
        run: |
          # 14 expert slots per layer x 40 layers x 18.8 MB ~= 10.5 GB of the 16 GB runner;
          # the rest of this worker's experts stay hot in the kernel page cache.
          CLUSTER_WORKER_CACHE=14 V41_DIRECT=0 nohup "$COLI" cluster worker --model "$VIEW" --port 9100 \
            > "$ASA_WORK/worker.log" 2>&1 &
          curl -sL "https://github.com/ekzhang/bore/releases/download/$BORE_VERSION/bore-$BORE_VERSION-x86_64-unknown-linux-musl.tar.gz" | tar xz -C "$ASA_WORK"
          nohup "$ASA_WORK/bore" local 9100 --to "${{ inputs.relay }}" > "$ASA_WORK/bore.log" 2>&1 &
          for _ in $(seq 1 30); do grep -qo "${{ inputs.relay }}:[0-9]*" "$ASA_WORK/bore.log" && break; sleep 1; done
          grep -o "${{ inputs.relay }}:[0-9]*" "$ASA_WORK/bore.log" | head -1 | tee addr.txt
          [ -s addr.txt ] || { cat "$ASA_WORK/bore.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: swarm-addr-${{ matrix.i }}
          path: addr.txt
          retention-days: 1
      - name: Serve until the coordinator finishes
        run: python3 -m asa.swarm.rendezvous wait-done --timeout 19000 || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Worker logs
        if: always()
        run: tail -n 40 "$ASA_WORK/worker.log" "$ASA_WORK/hffs.log" 2>/dev/null || true

  coordinator:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PROMPT: ${{ inputs.prompt }}
      NGEN: ${{ inputs.ngen }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
      - name: Node setup (HFFS mount + Colibri, dense tensors warmed)
        run: |
          export HFFS_ARGS="--warm-include . --warm-exclude \.experts\.|engram"
          CACHE_GB=30 ./asa/swarm/node_setup.sh
          until grep -q "warm done" "$ASA_WORK/hffs.log"; do sleep 10; done; grep warm "$ASA_WORK/hffs.log"
      - name: Wait for workers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          addrs=$(python3 -m asa.swarm.rendezvous wait-workers --count "${{ inputs.workers }}" --timeout 2400 --min 1)
          echo "WORKERS=$addrs" >> "$GITHUB_ENV"
          echo "workers: $addrs"
          python3 - "$addrs" <<'EOF'
          import socket, sys, time
          for a in sys.argv[1].split(","):
              h, p = a.rsplit(":", 1); t = time.time()
              try:
                  socket.create_connection((h, int(p)), timeout=10).close()
                  print(f"{a}: connect {1000*(time.time()-t):.0f} ms")
              except OSError as e:
                  print(f"{a}: {e}")
          EOF
      - name: Generate (763B, native precision, distributed)
        run: |
          start=$(date +%s)
          V41_DIRECT=0 V41_STATS=1 \
            "$COLI" run --model "$VIEW" --cluster-workers "$WORKERS" --ngen "$NGEN" --temp 0 "$PROMPT" \
            | tee answer.txt
          echo "ELAPSED=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
      - name: Report
        if: always()
        run: |
          {
            echo "## ASA Swarm: DeepSeek-V4.1-Flash 763B on free runners"
            echo "workers: \`${WORKERS:-none}\`  ·  wall: ${ELAPSED:-n/a} s  ·  ngen: $NGEN"
            echo '```'; tail -n 60 answer.txt 2>/dev/null; echo '```'
            echo '```'; tail -n 5 "$ASA_WORK/hffs.log" 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release workers
        if: always()
        run: echo done > done.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swarm-done
          path: done.txt
          retention-days: 1

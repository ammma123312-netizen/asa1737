# ASA project catalog: open-source tools for running very large models on
# limited hardware, and for hiding the latency that comes with it.
# Arabic explanations live in docs/asa/README.md.
#
# quality: lossless = output identical to the original model (or bit-exact under greedy)
#          lossy    = trades accuracy for speed/size (quantization, sparsity
#                     prediction, weaker-model routing, fuzzy cache hits)
#          depends  = engine is exact; quality is set by the weights you load
#
# solves: memory  = run a model bigger than RAM/VRAM
#         speed   = more tokens per second
#         latency = faster first answer / fewer slow calls
#         scale   = spread one model over several machines
#         quality = measure or guarantee output quality

categories:
  streaming: "Run models bigger than memory"
  quantization: "Shrink the weights"
  serving: "Fast inference engines"
  distributed: "Split one model across machines"
  latency: "Hide or avoid slow generations"
  platform: "Packaging and local model servers"
  kernels: "Low-level kernels that make the same math faster"
  moe-offload: "Expert/weight offloading research systems"
  speculative: "Exact speculative decoding (draft then verify)"
  kv-cache: "KV-cache reuse, transfer or compression"
  evaluation: "Prove an optimisation kept quality"
  infra: "Storage, download, networking and free/cheap compute"
  models: "Reference model repositories and deployment code"

projects:
  # --- streaming / offload -------------------------------------------------
  - name: Colibrì
    repo: JustVugg/colibri
    quality: depends
    category: streaming
    solves: [memory, scale]
    openai_api: true
    cpu_only_ok: true
    role: "Streams MoE experts from NVMe; GLM-5.2 (744B) on ~25 GB RAM. Has a cluster mode."
  - name: AirLLM
    repo: lyogavin/airllm
    quality: lossless
    category: streaming
    solves: [memory]
    openai_api: false
    cpu_only_ok: false
    role: "Layer-by-layer loading of dense models; 70B on a 4 GB GPU, 405B on 8 GB VRAM. Very slow."
